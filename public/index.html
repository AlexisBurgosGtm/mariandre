<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MariAndre</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="relative bg-slate-100 text-slate-900">
  <div class="pointer-events-none fixed inset-0 -z-10 bg-gradient-to-br from-slate-100 via-sky-50 to-blue-50"></div>
  <div class="pointer-events-none fixed -right-24 -top-24 -z-10 h-80 w-80 rounded-full bg-blue-200/40 blur-3xl"></div>
  <div class="pointer-events-none fixed -bottom-16 left-8 -z-10 h-64 w-64 rounded-full bg-sky-200/40 blur-3xl"></div>

  <div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-slate-900/40 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <div id="app" class="relative z-10 flex h-dvh min-h-0">
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-[88vw] -translate-x-full flex-col border-r border-slate-200/80 bg-white/95 p-4 shadow-xl backdrop-blur-xl transition-transform duration-200 ease-out lg:static lg:z-10 lg:w-64 lg:max-w-none lg:translate-x-0 lg:shadow-none"
    >
      <div class="mb-4 flex items-center justify-between gap-3 px-1">
        <div class="flex items-center gap-3">
          <img src="/logo.png" alt="MariAndre" class="h-9 w-9 rounded-2xl object-contain">
          <span class="text-lg font-semibold tracking-tight text-slate-900">MariAndre</span>
        </div>
        <button
          id="btn-close-sidebar"
          type="button"
          class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 lg:hidden"
          aria-label="Cerrar menú"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <nav id="nav" class="flex flex-1 flex-col gap-1 overflow-y-auto"></nav>
      <div class="mt-4 flex items-center gap-2 border-t border-slate-200 pt-3 text-xs text-slate-500">
        <span id="status-dot" class="h-2 w-2 shrink-0 rounded-full bg-amber-400"></span>
        <span id="server-status">Conectando...</span>
      </div>
    </aside>

    <main class="flex min-h-0 min-w-0 flex-1 flex-col">
      <header class="flex items-center justify-between gap-3 border-b border-slate-200/80 bg-white/80 px-3 py-3 shadow-sm backdrop-blur-xl sm:px-5">
        <div class="flex min-w-0 items-center gap-3">
          <button
            id="btn-open-sidebar"
            type="button"
            class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 lg:hidden"
            aria-label="Abrir menú"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1 id="page-title" class="truncate text-lg font-semibold text-slate-900 sm:text-xl">Inicio</h1>
        </div>
        <div id="topbar-actions" class="flex flex-wrap items-center justify-end gap-2"></div>
      </header>
      <section id="content" class="min-h-0 flex-1 overflow-y-auto p-3 transition-opacity duration-150 sm:p-5"></section>
    </main>
  </div>

  <div id="toast-container" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(100%-2rem,22rem)] flex-col gap-2"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module">
    const css = await fetch('/css/app.css').then((r) => r.text());
    const style = document.createElement('style');
    style.type = 'text/tailwindcss';
    style.textContent = css;
    document.head.appendChild(style);
    await import('/js/app.js');
  </script>
</body>
</html>

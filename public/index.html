<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MariAndre</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }
    #app {
      width: 100%;
      max-width: 100dvw;
      overflow: hidden;
    }
  </style>
</head>
<body class="relative overflow-x-hidden bg-[#e8eef6] text-slate-900">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-br from-[#e8eef6] via-[#eef3fb] to-[#dce8f8]"></div>
    <div class="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-blue-400/15 blur-3xl"></div>
    <div class="absolute -bottom-24 left-0 h-80 w-80 rounded-full bg-indigo-400/12 blur-3xl"></div>
    <div class="absolute right-1/3 top-1/2 h-64 w-64 rounded-full bg-sky-300/10 blur-3xl"></div>
  </div>

  <div id="app" class="relative z-10 flex h-dvh min-h-0 w-full max-w-[100dvw] overflow-hidden">
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-slate-900/50 backdrop-blur-sm" aria-hidden="true"></div>

    <aside
      id="sidebar"
      class="ma-sidebar fixed inset-y-0 left-0 z-50 flex w-[min(19rem,90vw)] -translate-x-full flex-col border-r border-blue-900/30 p-4 shadow-2xl transition-transform duration-200 ease-out"
      aria-hidden="true"
    >
      <div class="mb-5 flex items-center justify-between gap-3 px-1">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10 ring-1 ring-white/20">
            <img src="/logo.png" alt="MariAndre" class="h-7 w-7 object-contain">
          </div>
          <div class="min-w-0">
            <span class="block truncate text-base font-semibold tracking-tight text-white">MariAndre</span>
            <span class="block text-[10px] font-medium uppercase tracking-widest text-blue-200/80">Panel de control</span>
          </div>
        </div>
        <button
          id="btn-close-sidebar"
          type="button"
          class="inline-flex shrink-0 items-center justify-center rounded-lg border border-white/15 bg-white/10 px-2.5 py-2 text-xs text-blue-100 transition hover:bg-white/20"
          aria-label="Cerrar menú"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <p class="mb-2 px-2 text-[10px] font-semibold uppercase tracking-widest text-blue-200/70">Vistas</p>
      <nav id="nav" class="flex flex-1 flex-col gap-0.5 overflow-y-auto overscroll-contain pr-1"></nav>

      <div class="mt-4 flex items-center gap-2 border-t border-white/10 pt-3 text-xs text-blue-200/90">
        <span id="status-dot" class="h-2 w-2 shrink-0 rounded-full bg-amber-400"></span>
        <span id="server-status" class="min-w-0 truncate">Conectando...</span>
      </div>
    </aside>

    <button
      id="btn-open-sidebar"
      type="button"
      class="ma-menu-fab"
      aria-label="Abrir menú"
      title="Menú"
    >
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <main class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
      <header class="ma-app-header shrink-0 border-b border-blue-900/10 bg-gradient-to-r from-[#1e3a8a] via-[#1d4ed8] to-[#2563eb] shadow-md">
        <div class="flex min-h-[3.25rem] items-stretch gap-2 px-2 sm:min-h-[3.5rem] sm:px-3">
          <div class="flex min-w-0 flex-1 items-center gap-2 overflow-hidden py-2">
            <div class="hidden shrink-0 items-center gap-2 pr-2 sm:flex">
              <img src="/logo.png" alt="" class="h-7 w-7 rounded-lg object-contain ring-1 ring-white/20">
              <span class="text-sm font-semibold text-white/95">MariAndre</span>
            </div>
            <div
              id="tab-bar"
              class="ma-tab-bar hidden min-w-0 flex-1 flex-row flex-nowrap items-center gap-1 overflow-x-auto overflow-y-hidden overscroll-x-contain py-0.5"
              role="tablist"
              aria-label="Pestañas abiertas"
            ></div>
          </div>
          <div id="topbar-actions" class="flex max-w-[50%] shrink-0 flex-wrap items-center justify-end gap-1.5 self-center py-2 sm:max-w-none sm:gap-2"></div>
        </div>
      </header>

      <div id="tab-panels" class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden"></div>
    </main>
  </div>

  <div id="toast-container" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(100%-2rem,22rem)] flex-col gap-2"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module">
    const css = await fetch('/css/app.css').then((r) => r.text());
    const style = document.createElement('style');
    style.type = 'text/tailwindcss';
    style.textContent = css;
    document.head.appendChild(style);
    await import('/js/app.js');
  </script>
</body>
</html>
